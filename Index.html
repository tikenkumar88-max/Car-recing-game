<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helicopter Game</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
        touch-action: none;
    }

    canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(#65c7ff, #dff7ff);
    }

    #score {
        position: fixed;
        top: 15px;
        left: 15px;
        color: white;
        font-size: 24px;
        font-weight: bold;
        text-shadow: 2px 2px 4px #000;
        z-index: 2;
    }

    #gameOver {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background: rgba(0,0,0,0.55);
        color: white;
        z-index: 3;
    }

    #gameOver h1 {
        font-size: 42px;
        margin: 10px;
    }

    button {
        border: 0;
        padding: 14px 28px;
        border-radius: 10px;
        background: #ff3333;
        color: white;
        font-size: 20px;
        font-weight: bold;
    }

    #help {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 16px;
        text-shadow: 1px 1px 3px #000;
    }
</style>
</head>

<body>

<div id="score">Score: 0</div>

<div id="gameOver">
    <h1>Game Over</h1>
    <p id="finalScore">Score: 0</p>
    <button onclick="restartGame()">फिर से खेलें</button>
</div>

<div id="help">स्क्रीन दबाकर हेलीकॉप्टर ऊपर ले जाएँ</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

resize();
window.addEventListener("resize", resize);

let helicopter;
let obstacles;
let score;
let gameRunning;
let pressing;
let lastTime;
let obstacleTimer;

function resetGame() {
    helicopter = {
        x: 100,
        y: H / 2,
        width: 65,
        height: 35,
        velocity: 0
    };

    obstacles = [];
    score = 0;
    gameRunning = true;
    pressing = false;
    obstacleTimer = 0;

    document.getElementById("gameOver").style.display = "none";
    document.getElementById("score").textContent = "Score: 0";
}

function drawHelicopter() {
    const h = helicopter;

    // बॉडी
    ctx.fillStyle = "#e53935";
    ctx.fillRect(h.x, h.y + 10, 55, 25);

    // आगे का हिस्सा
    ctx.beginPath();
    ctx.arc(h.x + 55, h.y + 22, 13, 0, Math.PI * 2);
    ctx.fillStyle = "#e53935";
    ctx.fill();

    // शीशा
    ctx.fillStyle = "#bdefff";
    ctx.fillRect(h.x + 35, h.y + 13, 17, 13);

    // पूंछ
    ctx.fillStyle = "#e53935";
    ctx.fillRect(h.x - 30, h.y + 16, 35, 7);

    // पूंछ का पंखा
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(h.x - 28, h.y + 8);
    ctx.lineTo(h.x - 28, h.y + 31);
    ctx.stroke();

    // ऊपर रोटर
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(h.x + 25, h.y + 10);
    ctx.lineTo(h.x + 25, h.y - 5);
    ctx.stroke();

    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(h.x - 5, h.y - 5);
    ctx.lineTo(h.x + 55, h.y - 5);
    ctx.stroke();

    // नीचे स्किड
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(h.x + 10, h.y + 35);
    ctx.lineTo(h.x + 50, h.y + 35);
    ctx.stroke();
}

function createObstacle() {
    const gap = 180;
    const minTop = 60;
    const maxTop = H - gap - 80;

    const topHeight =
        Math.random() * (maxTop - minTop) + minTop;

    obstacles.push({
        x: W + 50,
        width: 65,
        top: topHeight,
        bottom: topHeight + gap,
        passed: false
    });
}

function drawObstacle(o) {
    ctx.fillStyle = "#228b22";

    // ऊपर पाइप
    ctx.fillRect(o.x, 0, o.width, o.top);

    // नीचे पाइप
    ctx.fillRect(
        o.x,
        o.bottom,
        o.width,
        H - o.bottom
    );

    // किनारा
    ctx.fillStyle = "#32cd32";
    ctx.fillRect(o.x - 5, o.top - 18, o.width + 10, 18);
    ctx.fillRect(o.x - 5, o.bottom, o.width + 10, 18);
}

function collision(o) {
    const h = helicopter;

    return (
        h.x < o.x + o.width &&
        h.x + h.width > o.x &&
        h.y < o.top ||
        h.x < o.x + o.width &&
        h.x + h.width > o.x &&
        h.y + h.height > o.bottom
    );
}

function gameOver() {
    gameRunning = false;

    document.getElementById("finalScore").textContent =
        "Score: " + score;

    document.getElementById("gameOver").style.display =
        "flex";
}

function update(dt) {
    if (!gameRunning) return;

    // हेलीकॉप्टर की गति
    if (pressing) {
        helicopter.velocity -= 0.45;
    } else {
        helicopter.velocity += 0.28;
    }

    helicopter.velocity *= 0.96;

    helicopter.y += helicopter.velocity;

    // ऊपर/नीचे टकराना
    if (
        helicopter.y < 0 ||
        helicopter.y + helicopter.height > H
    ) {
        gameOver();
    }

    // बाधाएँ
    obstacleTimer += dt;

    if (obstacleTimer > 1500) {
        createObstacle();
        obstacleTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];

        o.x -= 4;

        if (collision(o)) {
            gameOver();
        }

        if (!o.passed && o.x + o.width < helicopter.x) {
            o.passed = true;
            score++;
            document.getElementById("score").textContent =
                "Score: " + score;
        }

        if (o.x + o.width < 0) {
            obstacles.splice(i, 1);
        }
    }
}

function drawBackground() {
    // बादल
    ctx.fillStyle = "rgba(255,255,255,0.8)";

    for (let i = 0; i < 5; i++) {
        const x = (i * 230 + Date.now() / 50) % (W + 200) - 100;
        const y = 80 + i * 70;

        ctx.beginPath();
        ctx.arc(x, y, 25, 0, Math.PI * 2);
        ctx.arc(x + 30, y - 10, 32, 0, Math.PI * 2);
        ctx.arc(x + 60, y, 25, 0, Math.PI * 2);
        ctx.fill();
    }
}

function draw() {
    ctx.clearRect(0, 0, W, H);

    drawBackground();

    for (const o of obstacles) {
        drawObstacle(o);
    }

    drawHelicopter();
}

function loop(time) {
    const dt = time - lastTime;
    lastTime = time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

function restartGame() {
    resetGame();
}

function startPress(e) {
    e.preventDefault();
    pressing = true;
}

function endPress(e) {
    e.preventDefault();
    pressing = false;
}

canvas.addEventListener("touchstart", startPress);
canvas.addEventListener("touchend", endPress);
canvas.addEventListener("touchcancel", endPress);

canvas.addEventListener("mousedown", startPress);
canvas.addEventListener("mouseup", endPress);
canvas.addEventListener("mouseleave", endPress);

document.addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        pressing = true;
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
        pressing = false;
    }
});

resetGame();
lastTime = performance.now();
requestAnimationFrame(loop);
</script>

</body>
</html>
